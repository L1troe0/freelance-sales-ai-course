<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="2;url=https://l1troe0.github.io/freelance-sales-ai-course/">
<title>AIW — Фриланс-сайты через ИИ</title>
<style>
  :root{
    --bg:#0a0a11;
    --card:#14141f;
    --border:#242435;
    --text:#f2f2f5;
    --text-dim:#9a9aab;
    --accent:#8b5cf6;
    --accent2:#a78bfa;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(1100px 700px at 85% -10%, rgba(139,92,246,.16), transparent 60%),
      radial-gradient(900px 600px at -10% 110%, rgba(52,211,153,.08), transparent 55%),
      var(--bg);
    color:var(--text);
    padding:24px;
  }
  .card{
    max-width:420px;width:100%;text-align:center;
    padding:40px 28px;border-radius:18px;
    background:var(--card);border:1px solid var(--border);
  }
  .brand-icon{
    width:64px;height:64px;border-radius:50%;margin:0 auto 18px;
    background:radial-gradient(120% 120% at 32% 22%, #34343e 0%, #101014 55%, #000 100%);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 14px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.06);
  }
  .brand-icon span{
    font-weight:800;font-size:22px;letter-spacing:-.5px;font-style:italic;
    background:linear-gradient(135deg,#fdfdff 0%,#a9a9b6 35%,#ffffff 55%,#7a7a88 80%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  h1{font-size:22px;margin:0 0 6px;font-weight:900;}
  p{font-size:14.5px;color:var(--text-dim);line-height:1.5;margin:0 0 26px;}
  a.btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:14px 26px;border-radius:12px;
    background:linear-gradient(135deg,var(--accent),#6d3ff0);
    color:#fff;text-decoration:none;font-weight:700;font-size:15px;
  }
  .fallback{margin-top:18px;font-size:12px;color:#77778a;word-break:break-all;}
  .fallback a{color:var(--accent2);}
</style>
</head>
<body>
  <div class="card">
    <div class="brand-icon"><span>AIW</span></div>
    <h1>Фриланс-сайты через ИИ</h1>
    <p>Сейчас откроется курс. Если этого не произошло автоматически — нажмите на кнопку ниже.</p>
    <a class="btn" href="https://l1troe0.github.io/freelance-sales-ai-course/">Открыть курс →</a>
    <div class="fallback">или скопируйте ссылку:<br><a href="https://l1troe0.github.io/freelance-sales-ai-course/">https://l1troe0.github.io/freelance-sales-ai-course/</a></div>
  </div>
</body>
</html>
